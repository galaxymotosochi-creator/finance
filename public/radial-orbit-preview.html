<title>AtlasPos — орбита разделов</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff;color:#111;overflow-x:hidden}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  .stage{position:relative;width:100%;height:100vh;min-height:720px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .orbit{position:relative;width:100%;max-width:1000px;height:100%;display:flex;align-items:center;justify-content:center;perspective:1000px}

  .ring{position:absolute;width:290px;height:290px;border-radius:50%;border:1px solid rgba(16,40,90,.12)}
  .ring2{position:absolute;width:600px;height:600px;border-radius:50%;border:1px solid rgba(16,40,90,.06)}

  /* центр */
  .core{position:absolute;width:64px;height:64px;border-radius:18px;z-index:10;
    background:linear-gradient(135deg,#1F75FF,#0d4ea8);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:26px;letter-spacing:-.02em;
    animation:corepulse 3s ease-in-out infinite}
  @keyframes corepulse{0%,100%{box-shadow:0 0 0 0 rgba(31,117,255,.5)}50%{box-shadow:0 0 0 16px rgba(31,117,255,0)}}

  .core:before,.core:after{content:"";position:absolute;border-radius:18px;border:1px solid rgba(31,117,255,.28);animation:ping 2.4s ease-out infinite}
  .core:before{width:66px;height:66px}
  .core:after{width:70px;height:70px;animation-delay:.6s;border-color:rgba(31,117,255,.14)}
  @keyframes ping{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.45);opacity:0}}

  /* узел */
  .node{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;gap:7px;width:96px;
    cursor:pointer;transition:opacity .7s;will-change:transform,opacity}
  .orbit.parked .node{transition:transform .7s cubic-bezier(.4,0,.2,1), opacity .7s}
  .node .bubble{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
    background:#fff;border:1px solid rgba(16,40,90,.14);
    box-shadow:0 4px 12px -4px rgba(16,40,90,.22), 0 1px 3px -1px rgba(16,40,90,.10);
    transition:all .3s;flex:none}
  .node .label{font-size:10.5px;font-weight:600;line-height:1.25;text-align:center;color:rgba(0,0,0,.62);
    max-width:96px;transition:color .3s}
  .node:hover .bubble{background:#F3F8FF;border-color:rgba(31,117,255,.45)}
  .node:hover .label{color:#0d4ea8}
  .node .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#1F75FF}
  .node.related .bubble{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.14)}
  .node.active .bubble{background:linear-gradient(135deg,#1F75FF,#0d4ea8);border-color:#1F75FF;box-shadow:0 8px 20px -8px rgba(31,117,255,.8)}
  .node.active .ico{color:#fff}
  .node.active .label{color:#0d4ea8;font-weight:700}
  .node.pulse .bubble{animation:npulse 1.6s ease-in-out infinite}
  @keyframes npulse{0%,100%{box-shadow:0 0 0 0 rgba(31,117,255,.45)}50%{box-shadow:0 0 0 10px rgba(31,117,255,0)}}

  /* карточка раздела */
  .panel{position:absolute;z-index:300;width:min(430px,88vw);max-height:min(560px,76vh);overflow-y:auto;
    background:#fff;border:1px solid rgba(16,40,90,.12);border-radius:18px;
    padding:22px 22px 24px;backdrop-filter:blur(18px);box-shadow:0 30px 90px -30px rgba(16,40,90,.45), 0 8px 24px -12px rgba(16,40,90,.2);
    transform:scale(.94) translateY(8px);opacity:0;pointer-events:none;
    transition:opacity .3s ease, transform .35s cubic-bezier(.16,1,.3,1)}
  .panel.open{opacity:1;pointer-events:auto;transform:scale(1) translateY(0)}
  .phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .picon{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(31,117,255,.14),rgba(13,78,168,.14));border:1px solid rgba(31,117,255,.22);color:#1F75FF}
  .ptitle{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#111}
  .pdate{font-size:11px;color:#1F75FF;margin-top:2px;text-transform:uppercase;letter-spacing:.1em}
  .pclose{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:none;
    background:rgba(16,40,90,.06);color:#111;cursor:pointer;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .pclose:hover{background:rgba(16,40,90,.12)}
  .pcontent{font-size:13.5px;line-height:1.62;color:rgba(0,0,0,.66)}
  .pfeat{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .pfeat li{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:rgba(0,0,0,.62)}
  .pfeat li:before{content:"";width:5px;height:5px;border-radius:50%;background:#1F75FF;flex:none;margin-top:7px}
  .prelated{margin-top:16px;padding-top:14px;border-top:1px solid rgba(16,40,90,.1)}
  .prelated .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:rgba(0,0,0,.38);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:5px 11px;border-radius:100px;background:rgba(31,117,255,.08);
    border:1px solid rgba(31,117,255,.28);color:#0d4ea8}

  .hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.32)}

  @media(max-width:720px){
    .ring{width:240px;height:240px}

    .node .label{font-size:9px;max-width:74px}

/* ══════ СОСТОЯНИЕ (логика из промта) ══════ */
const RADIUS_OUT = 272;   // внешний ряд — придвинут к внешнему кольцу
const RADIUS_IN = 165;    // внутренний ряд — иконки отодвинуты от линии
let rotationAngle = 0;
let autoRotate = true;
let activeNodeId = null;
let expandedId = null;
let pulseSet = new Set();

const stage = document.getElementById('stage');
const orbit = document.getElementById('orbit');
const nodes = {};

function setParked(on){
  orbit.classList.toggle('parked', !!on);
}

function calc(index, total){
  // чётные — внешний ряд, нечётные — внутренний
  const isOut = index % 2 === 0;
  const radius = isOut ? RADIUS_OUT : RADIUS_IN;
  const inRow = isOut ? Math.ceil(total / 2) : Math.floor(total / 2);
  const rowIdx = Math.floor(index / 2);
  const step = 360 / inRow;
  const offset = isOut ? 0 : step / 2;
  const angle = ((rowIdx * step + offset + rotationAngle) % 360 + 360) % 360;
  const rad = angle * Math.PI / 180;
  const x = radius * Math.cos(rad);
  const y = radius * Math.sin(rad);
  return {
    x, y, angle,
    z: Math.round(100 + 50 * Math.cos(rad)),
    op: Math.max(0.4, Math.min(1, 0.4 + 0.6 * ((1 + Math.sin(rad)) / 2)))
  };
}

function related(id){
  const it = DATA.find(d => d.id === id);
  return it ? it.related : [];
}

function render(){
  if (autoRotate) rotationAngle = (rotationAngle + 0.3) % 360;
  DATA.forEach((item, i) => {
    const el = nodes[item.id];
    if (!el) return;
    const p = calc(i, DATA.length);
    const isActive = item.id === activeNodeId;
    el.style.transform = `translate(-50%,-50%) translate(${p.x}px, ${p.y}px)`;
    el.style.zIndex = isActive ? 200 : p.z;
    el.style.opacity = p.op;
    el.classList.toggle('active', isActive);
    el.classList.toggle('related', !!activeNodeId && related(activeNodeId).includes(item.id));
    el.classList.toggle('pulse', pulseSet.has(item.id));
  });
  requestAnimationFrame(render);
}

    <button class="pclose" aria-label="Закрыть">✕</button>
    <div class="phead">
      <div class="picon">${ICONS[item.icon]}</div>
      <div><div class="ptitle">${item.title}</div><div class="pdate">${item.cat}</div></div>
    </div>
    <div class="pcontent">${item.content}</div>
    <ul class="pfeat">${item.feats.map(f=>`<li>${f}</li>`).join('')}</ul>
    ${rel.length ? `<div class="prelated"><div class="lbl">Связанные разделы</div>
      <div class="chips">${rel.map(r=>`<span class="chip">${r.title}</span>`).join('')}</div></div>` : ''}
  `;
  panel.style.left = '50%';
  panel.style.top = '50%';
  panel.style.transform = 'scale(.94) translateY(8px)';
  panel.style.marginLeft = '-' + 0 + 'px';
  orbit.appendChild(panel);
  // центрирование
  const place = () => {
    const w = panel.offsetWidth, h = panel.offsetHeight;
    panel.style.marginLeft = (-w/2) + 'px';
    panel.style.marginTop = (-h/2) + 'px';
  };
  place();
  requestAnimationFrame(()=>{ place(); panel.classList.add('open'); });
  panel.querySelector('.pclose').onclick = (e)=>{ e.stopPropagation(); deselect(); };
}

function closePanel(keep){
  if (panel){ panel.remove(); panel = null; }
}

function deselect(){
  expandedId = null; activeNodeId = null; pulseSet = new Set();
  setParked(false);
  autoRotate = true; closePanel();
}

function select(item){
  if (expandedId === item.id){ deselect(); return; }
  expandedId = item.id;
  activeNodeId = item.id;
  autoRotate = false;
  pulseSet = new Set(related(item.id));
  // узел поднимается в верхнюю точку кольца (270°), радиус не меняется
  const idx = DATA.findIndex(d => d.id === item.id);
  const target = (idx / DATA.length) * 360;
  rotationAngle = ((270 - target) % 360 + 360) % 360;
  setParked(true);
  openPanel(item);
}

/* ══════ ПОСТРОЕНИЕ ══════ */
DATA.forEach(item => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML = `<div class="bubble"><span class="ico">${ICONS[item.icon]}</span></div><div class="label">${item.title}</div>`;
  el.addEventListener('click', e => { e.stopPropagation(); select(item); });
  orbit.appendChild(el);
  nodes[item.id] = el;
});

stage.addEventListener('click', e => {
  if (e.target === stage || e.target === orbit ||
      e.target.classList.contains('ring') || e.target.classList.contains('ring2') ||
      e.target.classList.contains('core') || e.target.tagName === 'I'){
    deselect();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') deselect(); });

render();

/* адаптив: радиус меньше на мобилке */
function resize(){
  const r = window.innerWidth < 720 ? 230 : 320;
  DATA.forEach((item,i)=>{

  });
}
window.addEventListener('resize', resize);
</script>
