<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtlasPos — оригинал из промта (Tailwind)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f9fafb;margin:0}</style>
</head>
<body>

<!-- ══════ КОМПОНЕНТ ИЗ ПРОМТА — БЕЗ ИЗМЕНЕНИЙ (кроме картинки логотипа) ══════ -->
<div id="root" class="overflow-x-hidden bg-gray-50">
  <header class="py-4 md:py-6">
    <div class="container px-4 mx-auto sm:px-6 lg:px-8">
      <div class="flex items-center justify-between">
        <div class="flex-shrink-0">
          <a href="#" class="flex rounded outline-none focus:ring-1 focus:ring-gray-900 focus:ring-offset-2">
            <img class="w-auto h-8" src="https://cdn.21st.dev/assets/mirror/73/7302b383d96fffb1e28617722caa6775f89acbf71ab6f1abf6e02404c73fe683.svg" alt="Brand logo" />
          </a>
        </div>

        <div class="flex lg:hidden">
          <button type="button" class="text-gray-900" onclick="toggleNav()" aria-expanded="false" id="burger">
            <svg id="ico-open" class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="ico-close" class="w-7 h-7" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="hidden lg:flex lg:ml-16 lg:items-center lg:justify-center lg:space-x-10 xl:space-x-16">
          <a href="#" class="text-base font-medium text-gray-900 hover:text-opacity-50 focus:ring-1 focus:ring-gray-900 focus:ring-offset-2">Overview</a>
          <a href="#" class="text-base font-medium text-gray-900 hover:text-opacity-50 focus:ring-1 focus:ring-gray-900 focus:ring-offset-2">Plans</a>
          <a href="#" class="text-base font-medium text-gray-900 hover:text-opacity-50 focus:ring-1 focus:ring-gray-900 focus:ring-offset-2">Integrations</a>
        </div>

        <div class="hidden lg:ml-auto lg:flex lg:items-center lg:space-x-10">
          <a href="#" class="text-base font-medium text-gray-900 hover:text-opacity-50 focus:ring-1 focus:ring-gray-900 focus:ring-offset-2">Sign In</a>
          <a href="#" class="inline-flex items-center justify-center px-6 py-3 text-base font-bold text-white bg-gray-900 rounded-xl hover:bg-gray-600 focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
            Create Account
          </a>
        </div>
      </div>

      <nav id="mnav" class="hidden">
        <div class="px-1 py-8">
          <div class="grid gap-y-7">
            <a href="#" class="flex items-center p-3 text-base font-medium text-gray-900 hover:bg-gray-50 rounded-xl">Overview</a>
            <a href="#" class="flex items-center p-3 text-base font-medium text-gray-900 hover:bg-gray-50 rounded-xl">Plans</a>
            <a href="#" class="flex items-center p-3 text-base font-medium text-gray-900 hover:bg-gray-50 rounded-xl">Integrations</a>
            <a href="#" class="flex items-center p-3 text-base font-medium text-gray-900 hover:bg-gray-50 rounded-xl">Sign In</a>
            <a href="#" class="inline-flex items-center justify-center px-6 py-3 text-base font-bold text-white bg-gray-900 rounded-xl hover:bg-gray-600 focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
              Create Account
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <section class="pt-12 bg-gray-50 sm:pt-16">
    <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
      <div class="max-w-2xl mx-auto text-center">
        <h1 class="px-6 text-lg text-gray-600">A developer-first platform for modern marketing</h1>
        <p class="mt-5 text-4xl font-bold text-gray-900 sm:text-5xl lg:text-6xl">
          Grow your audience with powerful
          <span class="relative inline-flex">
            <span class="bg-gradient-to-r from-[#44BCFF] via-[#FF44EC] to-[#FF675E] blur-lg filter opacity-30 absolute inset-0"></span>
            <span class="relative">automation</span>
          </span>
        </p>

        <div class="px-8 mt-9 sm:flex sm:justify-center sm:space-x-5 sm:px-0">
          <a href="#" class="inline-flex items-center justify-center w-full px-8 py-3 text-lg font-bold text-white bg-gray-900 rounded-xl sm:w-auto hover:bg-gray-600">
            Start Free Trial
          </a>

          <a href="#" class="inline-flex items-center justify-center w-full px-6 py-3 mt-4 text-lg font-bold text-gray-900 border-2 border-gray-400 rounded-xl sm:w-auto sm:mt-0 hover:bg-gray-900 hover:text-white">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 18 18">
              <path d="M8.18 13.4261C6.86 14.39 5 13.45 5 11.81V5.44C5 3.8 6.86 2.86 8.18 3.82L12.54 7.01C13.63 7.81 13.63 9.44 12.54 10.24L8.18 13.43Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Watch Preview
          </a>
        </div>

        <p class="mt-8 text-base text-gray-500">Try all features free for 60 days. No card required.</p>
      </div>
    </div>

    <div class="pb-12 bg-white">
      <div class="relative">
        <div class="absolute inset-0 h-2/3 bg-gray-50"></div>
        <div class="relative mx-auto">
          <div class="lg:max-w-6xl lg:mx-auto">
            <img class="transform scale-110" src="https://cdn.21st.dev/assets/mirror/1c/1ce273490b8181abe6ea7fca26791794f0f989c362405b6d4065a9f37ee2e6f0.png" alt="Marketing Illustration" />
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<!-- ══════ /КОМПОНЕНТ ══════ -->

<script>
function toggleNav(){
  var n=document.getElementById('mnav'), b=document.getElementById('burger');
  var o=document.getElementById('ico-open'), c=document.getElementById('ico-close');
  var open=n.classList.contains('hidden');
  n.classList.toggle('hidden', !open);
  b.setAttribute('aria-expanded', open);
  o.style.display = open ? 'none' : '';
  c.style.display = open ? '' : 'none';
}
</script>
</body>
</html>
