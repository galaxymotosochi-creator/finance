<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtlasPos — живые скрины в 3D-карусели</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden;background:#0b1220}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff}

  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:60px 0;overflow:hidden;perspective:1600px}
  .hero:before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(31,117,255,.22),transparent 70%),
               radial-gradient(ellipse 70% 50% at 50% 100%,rgba(13,78,168,.28),transparent 70%);
    pointer-events:none}

  .head{position:relative;text-align:center;padding:0 20px;margin-bottom:44px;z-index:2}
  .badge{display:inline-flex;padding:6px 16px;border-radius:100px;background:rgba(31,117,255,.16);
    border:1px solid rgba(31,117,255,.35);color:#8fb8ff;font-size:13px;font-weight:700;margin-bottom:18px}
  .head h1{font-size:clamp(28px,5vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .head h1 span{background:linear-gradient(135deg,#6ba8ff,#1F75FF 50%,#0d4ea8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .head p{margin-top:14px;font-size:clamp(14px,1.6vw,17px);color:rgba(255,255,255,.55);max-width:560px;margin-left:auto;margin-right:auto}

  /* ── сцена ── */
  .stage{position:relative;height:min(58vh,520px);display:flex;align-items:center;justify-content:center;
    perspective:1500px;perspective-origin:50% 50%}

  .ring{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    display:flex;align-items:center;justify-content:center}

  .card{position:absolute;
    width:min(74vw,860px);aspect-ratio:16/10;
    border-radius:12px;overflow:hidden;flex:none;
    background:#0d1420;border:1px solid rgba(255,255,255,.13);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.05) inset;
    transform-style:preserve-3d;backface-visibility:hidden;
    display:flex;flex-direction:column;
  }
  /* панель окна macOS */
  .card .bar{flex:none;height:34px;display:flex;align-items:center;gap:7px;padding:0 13px;
    background:linear-gradient(180deg,#1b2434,#151d2a);border-bottom:1px solid rgba(255,255,255,.07)}
  .card .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.35) inset}
  .card .dot.r{background:#ff5f57}
  .card .dot.y{background:#febc2e}
  .card .dot.g{background:#28c840}
  .card .addr{margin-left:10px;height:18px;flex:1;border-radius:6px;
    background:rgba(255,255,255,.06);max-width:220px}
  .card img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:top center}

  .card .cap{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:14px 16px;
    background:linear-gradient(0deg,rgba(6,10,20,.92),rgba(6,10,20,0));
    font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#cfe1ff}

  /* маска: края растворяются */
  .fade{position:absolute;inset:0;pointer-events:none;z-index:3}
  .fade:before,.fade:after{content:"";position:absolute;top:0;bottom:0;width:18%}
  .fade:before{left:0;background:linear-gradient(90deg,#0b1220,rgba(11,18,32,0))}
  .fade:after{right:0;background:linear-gradient(270deg,#0b1220,rgba(11,18,32,0))}

  /* индикатор */
  .dots{position:relative;display:flex;gap:8px;justify-content:center;margin-top:36px;z-index:2}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);display:block}
  .dots i.on{background:#1F75FF;width:22px;border-radius:100px}

  .note{position:relative;text-align:center;font-size:12px;color:rgba(255,255,255,.3);margin-top:26px;padding:0 20px;z-index:2}

  @media (max-width:640px){
    .stage{height:min(48vh,360px);perspective:1000px}
    .card{width:min(86vw,520px);border-radius:12px}
    .card .cap{font-size:11px;padding:10px 12px}
    .head{margin-bottom:28px}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="head">
    <div class="badge">Живые экраны системы</div>
    <h1>Так выглядит <span>AtlasPos</span> изнутри</h1>
    <p>Касса, склад, финансы и аналитика — настоящие экраны, а не мокапы</p>
  </div>

  <div class="stage">
    <div class="ring" id="ring"></div>
    <div class="fade"></div>
  </div>

  <div class="dots" id="dots"></div>
  <p class="note">Превью 3D-карусели. В бою сюда будут подставляться актуальные скрины из системы.</p>
</section>

<script>
/* ── ДАННЫЕ: живые экраны AtlasPos ── */
const SLIDES = [
  { src:'https://atlaspos.ru/screen1.jpg', cap:'Аналитика и выручка' },
  { src:'https://atlaspos.ru/screen1.jpg', cap:'Доходы и расходы' },
  { src:'https://atlaspos.ru/screen1.jpg', cap:'Склад и остатки' },
  { src:'https://atlaspos.ru/screen1.jpg', cap:'Клиенты' },
  { src:'https://atlaspos.ru/screen1.jpg', cap:'Отчёты и прибыль' },
];

const ring = document.getElementById('ring');
const dotsBox = document.getElementById('dots');
const N = SLIDES.length;
let cards = [];

SLIDES.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="addr"></span></div>` +
    `<img src="${s.src}" alt="${s.cap}" loading="lazy"><div class="cap">${s.cap}</div>`;
  ring.appendChild(el);
  cards.push(el);

  const d = document.createElement('i');
  if(i===0) d.className='on';
  dotsBox.appendChild(d);
});

/* ── 3D-раскладка: карточки по кругу ── */
let angleStep = 360 / N;
let radius = 0;
let current = 0;
let autoTimer = null;
let paused = false;

function layout(){
  const w = ring.clientWidth;
  const cardW = cards[0].offsetWidth;
  // радиус так, чтобы карточки не наслаивались сильно
  radius = Math.max(cardW * 1.05, w * 0.34);
  cards.forEach((c,i)=>{
    c.style.transform = '';
  });
  position(0);
}

function position(offset){
  const step = angleStep;
  cards.forEach((c,i)=>{
    const a = (i * step) + offset;
    const rad = (a - 90) * Math.PI / 180;
    const x = Math.cos(rad) * radius;
    const z = Math.sin(rad) * radius;
    // ближние крупнее, дальние меньше и тусклее
    const depth = (z + radius) / (2 * radius);      // 0..1
    const scale = 0.72 + depth * 0.5;
    const opacity = 0.35 + depth * 0.65;
    const blur = (1 - depth) * 2.2;
    c.style.transform =
      `translate3d(${x}px,0,${z}px) rotateY(${-a}deg) scale(${scale})`;
    c.style.opacity = opacity.toFixed(3);
    c.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : 'none';
    c.style.zIndex = String(Math.round(depth*100));
  });
}

/* ── вращение ── */
let targetOffset = 0, currentOffset = 0, raf = null;

function animate(){
  currentOffset += (targetOffset - currentOffset) * 0.08;
  position(currentOffset);
  if(Math.abs(targetOffset - currentOffset) > 0.05){
    raf = requestAnimationFrame(animate);
  } else {
    raf = null;
  }
}

function goTo(idx){
  current = ((idx % N) + N) % N;
  targetOffset = -current * angleStep;
  if(!raf) raf = requestAnimationFrame(animate);
  [...dotsBox.children].forEach((d,i)=> d.className = (i===current ? 'on' : ''));
}

function next(){ goTo(current + 1); }

function startAuto(){
  stopAuto();
  if(paused) return;
  autoTimer = setInterval(next, 3200);
}
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }

window.addEventListener('resize', ()=>{ layout(); goTo(current); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopAuto(); else startAuto();
});

layout();
setTimeout(()=>{ goTo(0); startAuto(); }, 300);
</script>
</body>
</html>
